# group_vars/k8s_cluster.yml
---
k8s_cluster_name: "kubernetes"
k8s_dns_domain: "cluster.local"

default_gateway_ipv4: 172.16.1.254
default_gateway_ipv6: fd00:172:16:1::254
dns_servers:
  - "1.1.1.1"
  - "2606:4700:4700::1111"

k8s_pod_subnet_ipv4: "10.244.0.0/16"
k8s_pod_subnet_ipv6: "fd00:10:244::/56"
k8s_service_subnet_ipv4: "10.96.0.0/12"
k8s_service_subnet_ipv6: "fd00:10:96::/108"

bgp:
  router_as: 64512
  node_as: 64513
  cluster_network_ipv4: 172.16.200.0/24
  cluster_network_ipv6: fd00:172:16:200::/64

kubeadm:
  version: "{{ kubernetes_version }}"
  cri_socket: "unix:///run/containerd/containerd.sock"
  skip_phases:
    - "addon/kube-proxy"
  certs_dir: "/etc/kubernetes/pki"
  control_plane_endpoint: "{{ hostvars[groups['k8s_masters'][0]]['node_ipv4'] }}:6443"
  pod_subnets: "{{ k8s_pod_subnet_ipv4 }},{{ k8s_pod_subnet_ipv6 }}"
  service_subnets: "{{ k8s_service_subnet_ipv4 }},{{ k8s_service_subnet_ipv6 }}"
  dns_domain: "{{ k8s_dns_domain }}"
