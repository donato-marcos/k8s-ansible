# k8s_cluster.yml
cluster_name: "kubernetes"
k8s_dns_domain: "cluster.local"
dns_servers:
  - "1.1.1.1"
  - "2606:4700:4700::1111"

pod_subnet_ipv4: "10.244.0.0/16"
pod_subnet_ipv6: "fd00:10:244::/56"
service_subnet_ipv4: "10.96.0.0/12"
service_subnet_ipv6: "fd00:10:96::/108"

kubeadm:
  version: "{{ kubernetes_version }}"
  cri_socket: "unix:///run/containerd/containerd.sock"
  skip_phases: ["addon/kube-proxy"]
  certs_dir: "/etc/kubernetes/pki"
  control_plane_endpoint: "{{ hostvars[groups['k8s_masters'][0]]['node_ipv4'] }}:6443"
  pod_subnets: "{{ pod_subnet_ipv4 }},{{ pod_subnet_ipv6 }}"
  service_subnets: "{{ service_subnet_ipv4 }},{{ service_subnet_ipv6 }}"
  dns_domain: "{{ k8s_dns_domain }}"
