# ansible-k8s-lab/inventory/production/hosts.yaml
---
all:
  children:
    vyos:
      children:
        network:
          hosts:
            k8s-vyos:
              ansible_host: 172.16.1.254
              ansible_user: ansible

    linux:
      children:
        kubeadm:
          children:
            k8s_cluster:
              children:
                k8s_masters:
                  hosts:
                    k8s-master01:
                      ansible_host: 172.16.1.11
                      ansible_user: ansible
                      k8s_role: control-plane
                      kubeadm_skip_phases: ["addon/kube-proxy"]

                k8s_workers:
                  hosts:
                    k8s-worker01:
                      ansible_host: 172.16.1.21
                      ansible_user: ansible
                      k8s_role: worker

                    k8s-worker02:
                      ansible_host: 172.16.1.22
                      ansible_user: ansible
                      k8s_role: worker